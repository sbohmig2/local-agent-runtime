[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "local-agent-runtime"
version = "0.3.0"
description = "Provider-neutral local agent runtime for reusable application integrations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28",
  "jsonschema>=4.25",
  "pyyaml>=6.0",
  "starlette>=0.48",
  "uvicorn>=0.35",
]

[dependency-groups]
dev = [
  "build>=1.3",
  "mypy>=1.18",
  "pytest>=8.4",
  "ruff>=0.13",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.25",
]

[project.scripts]
local-agent-runtime = "local_agent_runtime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_agent_runtime"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/local_agent_runtime",
]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
files = ["src", "tests"]
strict = true
pretty = true
